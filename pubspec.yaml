name: agendamento_pet_app
description: "Um aplicativo Flutter para agendamento e cuidados de pets."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ">=3.0.5 <4.0.0"
  flutter: "3.24.3"

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

  # UI and Animation packages
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  smooth_page_indicator: ^1.1.0

  # Icons
  phosphor_flutter: ^2.0.1

  # Functional Programming
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/image/gato-splash1.png
    - assets/image/dog-splash2.png
    - assets/image/foto-pet1.png
    - assets/image/foto-pet2.png
    - assets/icons/social/
